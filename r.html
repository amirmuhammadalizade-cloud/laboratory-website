<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود به حساب کاربری</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="register">
    <main class="form-id">

        <div class="form-header">
            <p>برای ورود، شماره تلفن خود را وارد کنید.</p>
        </div>

        <form id="phone-form">

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="09123456789"
                autocomplete="tel"
                inputmode="numeric"
                pattern="09[0-9]{9}"
                maxlength="11"
                required
            >

            <button type="submit" id="send-code">
                ارسال کد تأیید
            </button>

        </form>

        <div id="verification-section" hidden>

            <label for="verification-code">
                کد تأیید پیامک‌شده
            </label>

            <input
                type="text"
                id="verification-code"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
                placeholder="کد ۶ رقمی"
            >

            <button type="button" id="verify-code">
                تأیید و ورود
            </button>

        </div>

        <p class="footer-text">
            ورود سریع، ساده و امن
        </p>

    </main>

</body>
</html>
